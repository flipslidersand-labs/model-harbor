name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.22"
      coverage-threshold: 70
      # -race requires CGO, which is disabled (CGO_ENABLED=0) on this
      # runner image; drop it from the default test-flags.
      test-flags: "-timeout 60s"
